<meta name="claude:viewport-fit-sides" content="cover">
<title>Venue Router</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app shell. A dark navigation rail on the left, a top bar with system health and the live/sandbox and role switches, and one work area. Overview answers "is everything right"; rooms, signal path, patch and devices hold the detail. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --ink:#101828; --ink-2:#475467; --ink-3:#5d6b82; --line:#e1e5eb; --line-2:#c9d0da;
  --brand:#2456d6; --brand-soft:#e6eeff; --on-brand:#ffffff;
  --ok:#067647; --ok-soft:#e3f6ec; --warn:#a15c07; --warn-soft:#fdf1d3; --bad:#b42318; --bad-soft:#fde7e4; --sw:#5b3fb8; --sw-soft:#efeaff;
  --side:#0f1a2c; --side-ink:#eef2f8; --side-muted:#9aa8bd; --side-active:#1e2e4a;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1019; --surface:#131a26; --surface-2:#1a2332; --ink:#eef1f6; --ink-2:#b6bfcd; --ink-3:#93a0b3; --line:#243044; --line-2:#34435c;
  --brand:#7ea4ff; --brand-soft:#182849; --on-brand:#08132b;
  --ok:#4fd292; --ok-soft:#0f2c20; --warn:#f7b84b; --warn-soft:#37290d; --bad:#fb7c72; --bad-soft:#3a1613; --sw:#bca6f7; --sw-soft:#261d45;
  --side:#080c14; --side-ink:#eef2f8; --side-muted:#8b98ad; --side-active:#172238; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1019; --surface:#131a26; --surface-2:#1a2332; --ink:#eef1f6; --ink-2:#b6bfcd; --ink-3:#93a0b3; --line:#243044; --line-2:#34435c;
  --brand:#7ea4ff; --brand-soft:#182849; --on-brand:#08132b;
  --ok:#4fd292; --ok-soft:#0f2c20; --warn:#f7b84b; --warn-soft:#37290d; --bad:#fb7c72; --bad-soft:#3a1613; --sw:#bca6f7; --sw-soft:#261d45;
  --side:#080c14; --side-ink:#eef2f8; --side-muted:#8b98ad; --side-active:#172238; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1{font-size:20px;font-weight:600;letter-spacing:-0.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--ink-2)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.shell{display:flex;min-height:100%}
.side{width:216px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:16px 10px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:600;font-size:15px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 10px;border:0;border-radius:var(--r);background:none;color:var(--side-muted);text-align:left;font-weight:500}
.nav button:hover{color:var(--side-ink)}
.nav button.on{background:var(--side-active);color:var(--side-ink)}
.nav svg,.brand svg{width:16px;height:16px;flex:none}
.sidefoot{margin-top:auto;padding:10px;font-size:12px;color:var(--side-muted)}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .ttl{flex:1;min-width:200px}
.top .ttl p{color:var(--ink-3);font-size:13px}
.topright{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.health{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.ok i{background:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.bad i{background:var(--bad)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:500;color:var(--ink-2);min-height:30px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
main{padding:20px 24px 96px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%;padding-right:max(24px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.lg{min-height:44px;padding:8px 18px;font-size:15px}
.btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:18px 20px;border-left:4px solid var(--ink-3);border-radius:4px 12px 12px 4px}
.hero.ok{border-left-color:var(--ok)} .hero.warn{border-left-color:var(--warn)} .hero.info{border-left-color:var(--brand)}
.hero .state{flex:1;min-width:240px}
.hero .state p{color:var(--ink-2);margin-top:2px}
.hero .big{font-size:18px;font-weight:600}
.hero .acts{display:flex;flex-wrap:wrap;gap:8px}
.drift{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.drift b{color:var(--ink);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.room{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer}
.room:hover{border-color:var(--line-2)}
.room .rh{display:flex;align-items:center;gap:8px}
.room .rh h2{flex:1}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.sw{background:var(--sw-soft);color:var(--sw)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.kv{display:flex;flex-direction:column;gap:6px;margin:0}
.kv div{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.kv dt{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv dd{margin:0;font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv dd small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.panel{padding:16px}
.panel>h2{margin-bottom:10px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.log time{display:block;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:13px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.crumb .presets{margin-left:auto}
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--brand-soft);border-left-color:var(--brand)}
.row.over{outline:2px solid var(--brand);outline-offset:-2px}
.row .nm{flex:1;min-width:150px}
.row .nm b{display:block;font-weight:600}
.row .nm small,.raw{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.row .now{flex:1;min-width:150px}
.row .now b{display:block;font-weight:500}
.row .now small{color:var(--ink-3);font-size:12px}
.row .tags{display:flex;gap:6px;flex-wrap:wrap}
.srcs{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.src{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:grab}
.src:hover{border-color:var(--brand)}
.src span{flex:1;min-width:0;font-weight:500}
.src small{display:block;font-weight:400}
input[type=search],input[type=text],input[type=password],select{min-height:36px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);max-width:100%}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.check input{width:16px;height:16px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.stage{flex:1;min-width:130px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);border-top:3px solid var(--ink-3)}
.stage.rtr{border-top-color:var(--brand)} .stage.sw{border-top-color:var(--sw)} .stage.end{border-top-color:var(--ok);background:var(--surface-2)}
.stage small{display:block;color:var(--ink-3);font-size:12px}
.stage b{display:block;font-weight:600;overflow-wrap:anywhere}
.chev{align-self:center;color:var(--ink-3);font-size:18px}
.note{font-size:13px;color:var(--ink-2)}
.flowline{stroke-dasharray:7 5}
@keyframes flow{to{stroke-dashoffset:-12}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:560px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.thbtn{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.thbtn:hover,th[aria-sort] .thbtn{color:var(--ink)}
tr.devsel>td{background:var(--brand-soft);border-bottom-color:transparent}
tr.devedit>td{background:var(--surface-2);padding:14px 16px}
.devline{align-items:flex-start;margin-bottom:10px}.devline:last-child{margin-bottom:0}
.devline>*{min-height:36px;display:inline-flex;align-items:center}
.devk{flex:none;width:200px;font-weight:500;font-size:13px;color:var(--ink)}
.sysdl{margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px}.sysdl div{display:flex;gap:12px;flex-wrap:wrap}.sysdl dt{flex:none;width:240px;color:var(--ink-2)}.sysdl dd{margin:0;flex:1;min-width:200px}
td.num{font-family:var(--mono);color:var(--ink-3);width:52px}
.finds{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.plan{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.plan img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.plan.blank{aspect-ratio:16/9;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.plan.arr{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);max-width:170px;padding:4px 10px;border:1px solid var(--line-2);border-left:4px solid var(--ink-3);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left;line-height:1.25;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pin b,.pin small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin b{font-size:12px;font-weight:600}
.pin small{font-size:11px;color:var(--ink-2)}
.pin.ok{border-left-color:var(--ok)} .pin.warn{border-left-color:var(--warn);background:var(--warn-soft)} .pin.dev{border-left-color:var(--sw)} .pin.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.pin.sel{outline:2px solid var(--brand);outline-offset:1px;z-index:2}
.plan.arr .pin{cursor:grab;touch-action:none}
.simple .side,.simple .topright{display:none}
.simple main{max-width:760px;margin:0 auto;gap:14px}
.simple [data-act=trace]{display:none}
.s-status{padding:22px 24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.s-status.ok{border-left-color:var(--ok)} .s-status.warn{border-left-color:var(--warn)} .s-status.bad{border-left-color:var(--bad)}
.s-status div{flex:1;min-width:220px}
.s-big{font-size:24px;font-weight:600;line-height:1.25;text-wrap:balance}
.s-status p{color:var(--ink-2);font-size:15px;margin-top:4px}
.s-list{display:flex;flex-direction:column;gap:10px}
.s-tile,.s-row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.s-tile:hover,.s-row:hover{border-color:var(--line-2)}
.s-tile b,.s-row b{font-size:17px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.s-tile span,.s-row span{font-size:15px;color:var(--ink-2);text-align:right;min-width:0;overflow-wrap:anywhere}
.s-row span small{display:block;font-size:13px;color:var(--ink-3)}
.s-row.sel{border-color:var(--brand);background:var(--brand-soft)}
.s-row.static{cursor:default}
.s-flag{flex:none;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.s-label{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:-4px}
.s-presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.s-preset{min-height:64px;padding:10px 16px;font-size:17px;font-weight:600;border-radius:14px;border:1px solid var(--line-2);background:var(--surface)}
.s-preset.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.s-choose{padding:16px;border:1px solid var(--brand);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.s-choose p{font-size:15px;font-weight:500}
.s-srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.s-src{min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:500}
.s-src:hover{border-color:var(--brand)}
.s-src.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.s-foot{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;margin-top:10px}
.lbl{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.chip.rec{background:var(--bad-soft);color:var(--bad)}
.chip.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px}
.xbtn{border:0;background:none;color:inherit;padding:0;margin-left:6px;min-width:22px;min-height:22px;font-size:15px;line-height:1;border-radius:4px}
.xbtn:hover{background:var(--line-2)}
.tagx{padding:3px 4px 3px 10px;font-size:13px}
.actionbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.actionbar .in{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;max-width:720px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.actionbar .in span{flex:1;min-width:200px;font-weight:500}
.actionbar .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg)}
.actionbar .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
@media (max-width:900px){
  .shell{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand{padding:0 8px 0 0} .brand span{display:none}
  .nav{flex-direction:row} .nav button{white-space:nowrap}
  .sidefoot{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .row,.room,.src,.btn{transition:border-color .12s,background-color .12s} .flowline{animation:flow .7s linear infinite} }
</style>

    <div class="sidefoot" id="sidefoot"></div>

  <div class="work">

/* Blackmagic devices do not report what is plugged into them. The only clue the system holds is the names on the router's
   ports, such as REC-IN-01 or TRNX-OUT-1A, so those are read and offered. Nothing is saved until someone accepts it. */
function labelPorts(labels,re){var a=[];labels.forEach(function(l,i){if(re.test(l))a.push(i)});return a}
function ordinal(list,x){return list.slice().sort(function(a,b){return natCmp(a.name||a.id,b.name||b.id)}).indexOf(x)+1}
function sameList(a,b){return a.length===b.length&&a.every(function(v,i){return v===b[i]})}
function normName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function suggest(r){
  var parts=[],posts=[],fresh=true,found=0,n,f,rt,cur;
  var num=function(k){return '[\\s_-]*0*'+k+'(?!\\d)'};
  var setList=function(now,want,word,labels,mk){
    if(!want.length)return;found++;
    if(sameList(now,want))return;
    if(now.length)fresh=false;
    parts.push(word+' '+portNames(labels,want));
    now.forEach(function(p){posts.push(mk('rm',p))});want.forEach(function(p){posts.push(mk('add',p))})};
  if(r.deck){n=ordinal(DECKS,r.deck);var W='\\b(?:REC(?:ORD(?:ER)?)?|HYPERDECK|DECK)[\\s_-]*';
    f=labelPorts(RT.outL,new RegExp(W+'IN'+num(n),'i'));rt=labelPorts(RT.inL,new RegExp(W+'OUT'+num(n),'i'));
    if(f.length){found++;if(r.deck.feed!==f[0]){if(r.deck.feed!=null)fresh=false;parts.push('records from router output '+portNames(RT.outL,[f[0]]));posts.push({action:'deck-feed',id:r.id,port:f[0]})}}
    setList(r.deck.returns||[],rt,'plays back on router input',RT.inL,function(op,p){return {action:op==='rm'?'deck-ret-rm':'deck-ret-add',id:r.id,port:p}})}
  else if(r.conv){n=ordinal(CONVS,r.conv);var W2='\\b(?:TRNX|TERANEX|TRX|CONV(?:ERTER)?|CVRT)[\\s_-]*';
    f=labelPorts(RT.outL,new RegExp(W2+'IN'+num(n),'i'));rt=labelPorts(RT.inL,new RegExp(W2+'OUT'+num(n),'i'));
    setList(r.conv.feeds||[],f,'fed by router output',RT.outL,function(op,p){return {action:'conv-link',id:r.id,list:'feeds',op:op,port:p}});
    setList(r.conv.returns||[],rt,'comes back on router input',RT.inL,function(op,p){return {action:'conv-link',id:r.id,list:'returns',op:op,port:p}})}
  else if(r.mon){var toks=((r.mon.name||'')+' '+(r.mon.place||'')).match(/\d{3,}/g)||[],pl=normName(r.mon.place);
    f=labelPorts(RT.outL,{test:function(l){return toks.some(function(t){return new RegExp('(^|\\D)'+t+'(\\D|$)').test(l)})}});
    if(!f.length&&pl.length>=4)f=labelPorts(RT.outL,{test:function(l){return normName(l).indexOf(pl)>=0}});
    var mo=f.filter(function(i){return /MON/i.test(RT.outL[i])});if(mo.length)f=mo;
    if(f.length<=2)setList(r.mon.feeds||[],f,'fed by router output',RT.outL,function(op,p){return {action:'mon-link',id:r.id,op:op,port:p}})}
  else if(r.roomObj){var rp=normName(r.roomObj.where||r.roomObj.place),lk=LINKS.filter(function(l){return l.room===r.id})[0];
    f=rp.length>=4?labelPorts(RT.outL,{test:function(l){return normName(clean(l)).indexOf(rp)>=0}}):[];
    if(f.length===1&&!LINKS.some(function(l){return l.room!==r.id&&l.rtrOut===f[0]})){found++;
      if(!lk||lk.rtrOut!==f[0]){if(lk)fresh=false;parts.push('building feed comes from router output '+portNames(RT.outL,f));posts.push({action:'room-link',id:r.id,rtrOut:f[0],input:null})}}}
  if(!found)return null;
  return {posts:posts,text:parts.join('; '),fresh:fresh,match:!posts.length}}
