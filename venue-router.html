<meta name="claude:viewport-fit-sides" content="cover">
<title>Venue Router</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app shell. A dark navigation rail on the left, a top bar with system health and the live/sandbox and role switches, and one work area. Overview answers "is everything right"; rooms, signal path, patch and devices hold the detail. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --ink:#101828; --ink-2:#475467; --ink-3:#5d6b82; --line:#e1e5eb; --line-2:#c9d0da;
  --brand:#2456d6; --brand-soft:#e6eeff; --on-brand:#ffffff;
  --ok:#067647; --ok-soft:#e3f6ec; --warn:#a15c07; --warn-soft:#fdf1d3; --bad:#b42318; --bad-soft:#fde7e4; --sw:#5b3fb8; --sw-soft:#efeaff;
  --side:#0f1a2c; --side-ink:#eef2f8; --side-muted:#9aa8bd; --side-active:#1e2e4a;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1019; --surface:#131a26; --surface-2:#1a2332; --ink:#eef1f6; --ink-2:#b6bfcd; --ink-3:#93a0b3; --line:#243044; --line-2:#34435c;
  --brand:#7ea4ff; --brand-soft:#182849; --on-brand:#08132b;
  --ok:#4fd292; --ok-soft:#0f2c20; --warn:#f7b84b; --warn-soft:#37290d; --bad:#fb7c72; --bad-soft:#3a1613; --sw:#bca6f7; --sw-soft:#261d45;
  --side:#080c14; --side-ink:#eef2f8; --side-muted:#8b98ad; --side-active:#172238; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1019; --surface:#131a26; --surface-2:#1a2332; --ink:#eef1f6; --ink-2:#b6bfcd; --ink-3:#93a0b3; --line:#243044; --line-2:#34435c;
  --brand:#7ea4ff; --brand-soft:#182849; --on-brand:#08132b;
  --ok:#4fd292; --ok-soft:#0f2c20; --warn:#f7b84b; --warn-soft:#37290d; --bad:#fb7c72; --bad-soft:#3a1613; --sw:#bca6f7; --sw-soft:#261d45;
  --side:#080c14; --side-ink:#eef2f8; --side-muted:#8b98ad; --side-active:#172238; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1{font-size:20px;font-weight:600;letter-spacing:-0.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--ink-2)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.shell{display:flex;min-height:100%}
.side{width:216px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:16px 10px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:600;font-size:15px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 10px;border:0;border-radius:var(--r);background:none;color:var(--side-muted);text-align:left;font-weight:500}
.nav button:hover{color:var(--side-ink)}
.nav button.on{background:var(--side-active);color:var(--side-ink)}
.nav svg,.brand svg{width:16px;height:16px;flex:none}
.sidefoot{margin-top:auto;padding:10px;font-size:12px;color:var(--side-muted)}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .ttl{flex:1;min-width:200px}
.top .ttl p{color:var(--ink-3);font-size:13px}
.topright{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.health{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.ok i{background:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.bad i{background:var(--bad)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:500;color:var(--ink-2);min-height:30px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
main{padding:20px 24px 96px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%;padding-right:max(24px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.lg{min-height:44px;padding:8px 18px;font-size:15px}
.btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:18px 20px;border-left:4px solid var(--ink-3);border-radius:4px 12px 12px 4px}
.hero.ok{border-left-color:var(--ok)} .hero.warn{border-left-color:var(--warn)} .hero.info{border-left-color:var(--brand)}
.hero .state{flex:1;min-width:240px}
.hero .state p{color:var(--ink-2);margin-top:2px}
.hero .big{font-size:18px;font-weight:600}
.hero .acts{display:flex;flex-wrap:wrap;gap:8px}
.drift{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.drift b{color:var(--ink);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.room{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer}
.room:hover{border-color:var(--line-2)}
.room .rh{display:flex;align-items:center;gap:8px}
.room .rh h2{flex:1}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.sw{background:var(--sw-soft);color:var(--sw)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.kv{display:flex;flex-direction:column;gap:6px;margin:0}
.kv div{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.kv dt{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv dd{margin:0;font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv dd small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.panel{padding:16px}
.panel>h2{margin-bottom:10px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.log time{display:block;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:13px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.crumb .presets{margin-left:auto}
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--brand-soft);border-left-color:var(--brand)}
.row.over{outline:2px solid var(--brand);outline-offset:-2px}
.row .nm{flex:1;min-width:150px}
.row .nm b{display:block;font-weight:600}
.row .nm small,.raw{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.row .now{flex:1;min-width:150px}
.row .now b{display:block;font-weight:500}
.row .now small{color:var(--ink-3);font-size:12px}
.row .tags{display:flex;gap:6px;flex-wrap:wrap}
.srcs{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.src{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:grab}
.src:hover{border-color:var(--brand)}
.src span{flex:1;min-width:0;font-weight:500}
.src small{display:block;font-weight:400}
input[type=search],input[type=text],input[type=password],select{min-height:36px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);max-width:100%}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.check input{width:16px;height:16px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.stage{flex:1;min-width:130px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);border-top:3px solid var(--ink-3)}
.stage.rtr{border-top-color:var(--brand)} .stage.sw{border-top-color:var(--sw)} .stage.end{border-top-color:var(--ok);background:var(--surface-2)}
.stage small{display:block;color:var(--ink-3);font-size:12px}
.stage b{display:block;font-weight:600;overflow-wrap:anywhere}
.chev{align-self:center;color:var(--ink-3);font-size:18px}
.note{font-size:13px;color:var(--ink-2)}
.flowline{stroke-dasharray:7 5}
@keyframes flow{to{stroke-dashoffset:-12}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:560px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.num{font-family:var(--mono);color:var(--ink-3);width:52px}
.finds{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.plan{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.plan img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.plan.blank{aspect-ratio:16/9;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.plan.arr{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);max-width:170px;padding:4px 10px;border:1px solid var(--line-2);border-left:4px solid var(--ink-3);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left;line-height:1.25;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pin b,.pin small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin b{font-size:12px;font-weight:600}
.pin small{font-size:11px;color:var(--ink-2)}
.pin.ok{border-left-color:var(--ok)} .pin.warn{border-left-color:var(--warn);background:var(--warn-soft)} .pin.dev{border-left-color:var(--sw)} .pin.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.pin.sel{outline:2px solid var(--brand);outline-offset:1px;z-index:2}
.plan.arr .pin{cursor:grab;touch-action:none}
.simple .side,.simple .topright{display:none}
.simple main{max-width:760px;margin:0 auto;gap:14px}
.simple [data-act=trace]{display:none}
.s-status{padding:22px 24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.s-status.ok{border-left-color:var(--ok)} .s-status.warn{border-left-color:var(--warn)} .s-status.bad{border-left-color:var(--bad)}
.s-status div{flex:1;min-width:220px}
.s-big{font-size:24px;font-weight:600;line-height:1.25;text-wrap:balance}
.s-status p{color:var(--ink-2);font-size:15px;margin-top:4px}
.s-list{display:flex;flex-direction:column;gap:10px}
.s-tile,.s-row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.s-tile:hover,.s-row:hover{border-color:var(--line-2)}
.s-tile b,.s-row b{font-size:17px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.s-tile span,.s-row span{font-size:15px;color:var(--ink-2);text-align:right;min-width:0;overflow-wrap:anywhere}
.s-row span small{display:block;font-size:13px;color:var(--ink-3)}
.s-row.sel{border-color:var(--brand);background:var(--brand-soft)}
.s-row.static{cursor:default}
.s-flag{flex:none;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.s-label{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:-4px}
.s-presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.s-preset{min-height:64px;padding:10px 16px;font-size:17px;font-weight:600;border-radius:14px;border:1px solid var(--line-2);background:var(--surface)}
.s-preset.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.s-choose{padding:16px;border:1px solid var(--brand);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.s-choose p{font-size:15px;font-weight:500}
.s-srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.s-src{min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:500}
.s-src:hover{border-color:var(--brand)}
.s-src.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.s-foot{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;margin-top:10px}
.lbl{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.chip.rec{background:var(--bad-soft);color:var(--bad)}
.chip.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px}
.xbtn{border:0;background:none;color:inherit;padding:0;margin-left:6px;min-width:22px;min-height:22px;font-size:15px;line-height:1;border-radius:4px}
.xbtn:hover{background:var(--line-2)}
.tagx{padding:3px 4px 3px 10px;font-size:13px}
.actionbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.actionbar .in{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;max-width:720px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.actionbar .in span{flex:1;min-width:200px;font-weight:500}
.actionbar .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg)}
.actionbar .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
@media (max-width:900px){
  .shell{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand{padding:0 8px 0 0} .brand span{display:none}
  .nav{flex-direction:row} .nav button{white-space:nowrap}
  .sidefoot{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .row,.room,.src,.btn{transition:border-color .12s,background-color .12s} .flowline{animation:flow .7s linear infinite} }
</style>

<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h5l3 8h4M2 12h3M11 4h3"/></svg></div><span>Venue Router</span></div>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-nav="overview"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7l6-5 6 5v7H2z"/></svg>Overview</button>
      <button type="button" data-nav="map"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1.5" y="3" width="4" height="3" rx="1"/><rect x="1.5" y="10" width="4" height="3" rx="1"/><rect x="10.5" y="6.5" width="4" height="3" rx="1"/><path d="M5.5 4.5c3 0 2 3.5 5 3.5M5.5 11.5c3 0 2-3.5 5-3.5"/></svg>System map</button>
      <button type="button" data-nav="floor"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 2.5h12v11H2zM2 8h5M9.5 2.5v4M9.5 9.5v4"/></svg>Floor plan</button>

        <label class="check" id="nice-wrap" hidden><input type="checkbox" id="nice">Nice names</label>

    <main id="main"></main>
  </div>
</div>
<div class="actionbar" id="bar" hidden></div>

<script>
(function(){
var SNAP=JSON.parse(document.getElementById('snap').textContent);
function $(id){return document.getElementById(id)}
if(!SNAP){$('main').textContent='This copy of the page has no system in it. Start the server with "node server.js" and open the address it prints, or run capture.js to make an offline copy.';return}

/* Venue setup comes from the server (venue.json and spaces.json), never from this file. */
var TIE_OUT=0,TIE_IN=0;
var GROUPS=[];
var OUT_NAME={},SRC_NAME={},MIX={};
var COMMON=[];

var RT=SNAP.rtr,SW=SNAP.sw,ROOMS=[],PLACES={},LINKS=[],NORMAL=null,FLOOR={pins:{},hasImage:false,v:0};
var LIVE=!!window.VENUE_LIVE,mode=LIVE?'live':'snap',conn=null,latest=null,lost=false;

    else if(a==='pin-set'){var pv=$('pin-new').value;
      if(!/^\d{4,8}$/.test(pv)){pinSetErr='Use 4 to 8 digits.';render();$('pin-new').focus();return}
      fetch('auth/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pv})}).then(function(r){
        if(!r.ok)return r.text().then(function(t2){pinSetErr=t2||'The PIN could not be saved. Try again.';render()});
        pinSetErr='';auth.pinSet=true;auth.ok=true;connectES();say('PIN saved. Engineer view now asks for it.');render()}).catch(function(){pinSetErr='The server did not answer. Try again.';render()})}
    else if(a==='pin-remove'){pending={raw:true,yes:'Remove PIN',text:'Remove the PIN? Anyone will be able to open Engineer view and change the setup.',fn:function(){
      fetch('auth/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:''})}).then(function(r){if(!r.ok)throw 0;auth.pinSet=false;auth.ok=false;connectES();say('PIN removed. Engineer view is open to anyone.');render()}).catch(function(){say('The PIN could not be removed. Try again.','bad')})}};renderBar()}
    else if(a==='mon-link'){var ml=b.dataset,mp=ml.op==='rm'?+ml.port:(function(){var s4=$('mon-feeds-'+ml.id);return s4&&s4.value!==''?+s4.value:null})();if(mp!==null)devPost({action:'mon-link',id:ml.id,op:ml.op,port:mp},'Saved for everyone.')}
    else if(a==='conv-link'){var cl=b.dataset,cp=cl.op==='rm'?+cl.port:(function(){var s3=$('conv-'+cl.list+'-'+cl.id);return s3&&s3.value!==''?+s3.value:null})();if(cp!==null)devPost({action:'conv-link',id:cl.id,list:cl.list,op:cl.op,port:cp},'Saved for everyone.')}
    else if(a==='deck-ret-add'){var ds2=$('deck-ret-'+b.dataset.id);if(ds2&&ds2.value!=='')devPost({action:'deck-ret-add',id:b.dataset.id,port:+ds2.value},'Saved for everyone.')}
    else if(a==='deck-ret-rm'){devPost({action:'deck-ret-rm',id:b.dataset.id,port:+b.dataset.port},'Saved for everyone.')}
    else if(a==='dev-scan'){if(devBusy)return;var sn=($('dev-subnet').value||'').trim();devBusy=true;devErr='';render();
      fetch('scan?subnet='+encodeURIComponent(sn)).then(function(r){if(r.ok)return r.json();return r.text().then(function(t){throw new Error(t)})}).then(function(j){devScan=j;devBusy=false;render()}).catch(function(e2){devBusy=false;devErr=e2&&e2.message?e2.message:'The search did not finish. Try again.';render()})}
    else if(a==='dev-add'){var dip=b.dataset.ip,dpl=(devForm.places[dip]||'').trim(),dfd=devScan&&devScan.found.filter(function(x){return x.ip===dip})[0],drl=dfd&&dfd.kind?dfd.kind:(devForm.roles[dip]||'room');if(drl!=='router'&&drl!=='switcher'&&!dpl){devErr='Enter where the device at '+dip+' is before adding it.';render();return}devAdd(dip,dpl,drl)}
    else if(a==='dev-add-manual'){var mip=devForm.ip.trim(),mpl=devForm.place.trim();if(!mip){devErr='Enter the device address.';render();return}if(devForm.role!=='router'&&devForm.role!=='switcher'&&!mpl){devErr='Enter where the device is.';render();return}devAdd(mip,mpl,devForm.role)}
    else if(a==='dev-rm'){var rid=b.dataset.id,rr=ROOMS.filter(function(x){return x.id===rid})[0];pending={raw:true,yes:'Remove device',text:'Remove '+(rr?'the '+rr.place+' switcher':rid.indexOf('conv-')===0?'this converter':rid.indexOf('mon-')===0?'this monitor':'this recorder')+' from the app? The device itself is not touched.',fn:function(){devPost({action:'remove',id:rid},'Device removed.')}};renderBar()}
    else if(a==='sp-new'){var nn=$('sp-new').value.trim();
      if(!nn){spErr='Enter a name for the new space.';render();return}
      if(GROUPS.some(function(x){return x.name.toLowerCase()===nn.toLowerCase()})){spErr='A space is already called "'+nn+'". Try another name.';render();return}
      var base=nn.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'space',nid=base,k=2;
      while(grp(nid)||ROOMS.some(function(r){return r.id===nid})||nid==='all')nid=base+'-'+(k++);
      spErr='';GROUPS.push({id:nid,name:nn,dests:[],confirm:true,modes:[]});saveSpaces();render()}
    else if(a==='sp-add'){var ag=grp(b.dataset.g),sel=$('sp-add-'+ag.id);if(sel&&sel.value!==''){ag.dests.push(+sel.value);saveSpaces();render()}}
    else if(a==='sp-rm'){var rg2=grp(b.dataset.g);rg2.dests=rg2.dests.filter(function(x){return x!==+b.dataset.d});saveSpaces();render()}
    else if(a==='sp-rmmode'){grp(b.dataset.g).modes.splice(+b.dataset.i,1);saveSpaces();render()}
    else if(a==='sp-up'||a==='sp-down'){var ix=GROUPS.indexOf(grp(b.dataset.g)),jx=ix+(a==='sp-up'?-1:1);if(jx>=0&&jx<GROUPS.length){var tmp=GROUPS[ix];GROUPS[ix]=GROUPS[jx];GROUPS[jx]=tmp;saveSpaces(true);render()}}
    else if(a==='sp-del'){var dg=grp(b.dataset.g);pending={raw:true,yes:'Delete space',text:'Delete the space "'+dg.name+'"? Its screens stay on the router and can be added to another space.',fn:function(){GROUPS=GROUPS.filter(function(x){return x!==dg});saveSpaces()}};renderBar()}
    else if(a==='arrange'){arrange=!arrange;placing=null;floorErr='';render()}
    else if(a==='place'){placing=placing===b.dataset.k?null:b.dataset.k;render()}
    else if(a==='unpin'){if(floorSel){delete FLOOR.pins[floorSel];floorSel=null;savePins();render()}}
    else if(a==='floor-noimg'){if(LIVE)fetch('floor-image',{method:'POST',headers:{'Content-Type':'image/png'},body:''}).catch(function(){say('The image could not be removed. Try again.','bad')});else{localImg=null;render()}}
    else if(a==='openroom'){if(role==='volunteer'){space=b.dataset.g;try{localStorage.setItem('vr-space',space)}catch(e2){}pick=null;go('overview')}else go('room',b.dataset.g)}
    else if(a==='undo'){if(history.length){S=JSON.parse(history.pop());addLog('Last change undone','sandbox');render()}}
    else if(a==='restore'){var rg=grp(space);
      pending=rg?{fn:function(){restoreSpace(rg)},text:'Set '+rg.name+' back to '+refName()+'?',log:rg.name+' set back to '+refName()}:{fn:function(){S=JSON.parse(JSON.stringify(BASE))},text:'Set every screen back to '+refName()+'?',log:'Everything set back to '+refName()};
      renderBar()}
    else if(a==='save-normal'){pending={raw:true,text:(NORMAL?'Replace the saved Normal service with':'Save')+' what the hardware shows right now'+(NORMAL?'?':' as Normal service?'),fn:function(){fetch('normal',{method:'POST'}).then(function(r){if(!r.ok)throw 0;say('Normal service saved.')}).catch(function(){say('Normal service could not be saved. Try again.','bad')})}};renderBar()}
    else if(a==='trace'){showPath(+b.dataset.d)}
    else if(a==='mode'){var g=grp(b.dataset.g),m=g.modes[+b.dataset.i];applySet(g,m.set,m.name)}
    else if(a==='showall'){showAll=true;render();if($('src-search'))$('src-search').focus()}
    else if(a==='save-preset'){var g2=grp(b.dataset.g),n=$('name-'+g2.id).value.trim();
      if(!n){errs[g2.id]='Enter a name first.';render();return}
      if(g2.modes.some(function(x){return x.name.toLowerCase()===n.toLowerCase()})){errs[g2.id]='That name is already used. Try another.';render();return}
      g2.modes.push({name:n,set:groupSet(g2)});errs[g2.id]='';saveSpaces(true);say('Preset "'+n+'" saved for '+g2.name+'.');render()}
    return}
  var t;
  if((t=e.target.closest('[data-space-go]'))){space=t.dataset.spaceGo;try{localStorage.setItem('vr-space',space)}catch(e3){}pick=null;render();window.scrollTo(0,0);return}
  if((t=e.target.closest('[data-flow]'))){flowMode=t.dataset.flow;render();return}
  if((t=e.target.closest('[data-nav]'))){go(t.dataset.nav);return}
  if((t=e.target.closest('[data-pin]'))){if(justDragged)return;var pk=t.dataset.pin;floorSel=floorSel===pk?null:pk;render();return}
  if(arrange&&placing&&(t=e.target.closest('#plan'))){var pr=t.getBoundingClientRect();FLOOR.pins[placing]={x:Math.round((e.clientX-pr.left)/pr.width*1000)/10,y:Math.round((e.clientY-pr.top)/pr.height*1000)/10};floorSel=placing;placing=null;savePins();render();return}
  if((t=e.target.closest('[data-map]'))){var mk=t.getAttribute('data-map');mapSel=mapSel===mk?null:mk;render();
    var md=$('map-detail');if(md&&mapSel){var mr=md.getBoundingClientRect();if(mr.top<0||mr.top>window.innerHeight-120)md.scrollIntoView({block:'start'})}return}
  if((t=e.target.closest('[data-role]'))){
    if(t.dataset.role==='engineer'){
      if(LIVE&&!auth.pinSet&&auth.open===false){say("Engineer view can only be opened on the computer running Venue Router until a PIN is set there.");return}
      if(LIVE&&auth.pinSet&&!auth.ok){pinAsk=true;pinErr='';render();if($('pin-in'))$('pin-in').focus();return}
      role='engineer';render();return}
    role='volunteer';
    if(LIVE&&auth.pinSet&&auth.ok){auth.ok=false;fetch('auth/logout',{method:'POST'}).then(connectES,connectES)}
    render();return}
  if((t=e.target.closest('[data-mode]'))){if(t.dataset.mode===mode)return;if(t.dataset.mode==='sandbox')mode='sandbox';else{mode='live';if(latest)load(latest)}toast=null;render();return}
  if((t=e.target.closest('[data-src]'))){if(pick===null){say('Select a screen first, then choose its source.');return}routeDest(pick,+t.dataset.src);return}
  if(e.target.closest('input,label,select'))return;
  if((t=e.target.closest('[data-dest]'))){var d=+t.dataset.dest;pick=pick===d?null:d;render();return}
  if((t=e.target.closest('[data-room]'))){go('room',t.dataset.room);return}
  if((t=e.target.closest('[data-row]'))){showPath(+t.dataset.row)}});
document.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var t=e.target;if(t.matches&&t.matches('[data-dest],[data-row],[data-room],[data-map]')){e.preventDefault();t.click()}});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='floor-file'){var f=t.files&&t.files[0];if(!f)return;
    if(['image/png','image/jpeg','image/webp'].indexOf(f.type)<0){floorErr='Use a PNG, JPEG or WebP image.';render();return}
    if(f.size>8*1024*1024){floorErr='That image is over 8 MB. Use a smaller one.';render();return}
    floorErr='';
    if(LIVE)fetch('floor-image',{method:'POST',headers:{'Content-Type':f.type},body:f}).then(function(r){if(!r.ok)throw 0;say('Plan image saved.')}).catch(function(){say('The image could not be saved. Try again.','bad')});
    else{localImg=URL.createObjectURL(f);render()}}
  else if(t.dataset.deckFeed){devPost({action:'deck-feed',id:t.dataset.deckFeed,port:t.value===''?null:+t.value},'Saved for everyone.')}
  else if(t.dataset.devPlace){var dv=t.value.trim();if(!dv){devErr='A device needs a place.';render();return}devPost({action:'place',id:t.dataset.devPlace,place:dv},'Saved for everyone.')}
  else if(t.dataset.devf){var dk=t.dataset.devf;if(dk.indexOf('r:')===0)devForm.roles[dk.slice(2)]=t.value;else if(dk==='role')devForm.role=t.value}
  else if(t.id==='nice'){NICE=t.checked;render()}
  else if(t.id==='space'){space=t.value;try{localStorage.setItem('vr-space',space)}catch(e){}
    pick=null;mapSel=null;q='';showAll=false;var sgn=grp(space);if(sgn&&sgn.dests.indexOf(traced)<0)traced=sgn.dests[0];if(view==='room')view='overview';render()}
  else if(t.id==='map-scope'){mapScope=t.value;mapSel=null;render()}
  else if(t.id==='map-unused'){mapUnused=t.checked;render()}
  else if(t.id==='map-rtr'){mapShowRtr=t.checked;render()}
  else if(t.id==='map-sw'){mapShowSw=t.checked;render()}
  else if(t.id==='map-paths'){mapPaths=t.value;render()}
  else if(t.id==='map-named'){mapNamed=t.checked;render()}
  else if(t.dataset.ask){grp(t.dataset.ask).confirm=t.checked;saveSpaces(true)}
  else if(t.dataset.spVis){grp(t.dataset.spVis).hidden=!t.checked;saveSpaces();render()}
  else if(t.dataset.prefRoom){var pr2=t.dataset.prefRoom;PREFS.hideRooms=PREFS.hideRooms.filter(function(x){return x!==pr2});if(!t.checked)PREFS.hideRooms.push(pr2);savePrefs()}
  else if(t.id==='pf-floor'){PREFS.hideFloor=!t.checked;savePrefs()}
  else if(t.id==='pf-gear'){PREFS.hideGear=!t.checked;savePrefs()}
  else if(t.dataset.spName){var sg2=grp(t.dataset.spName),nv=t.value.trim();
    if(!nv){spErr='A space needs a name.';render();return}
    if(GROUPS.some(function(x){return x!==sg2&&x.name.toLowerCase()===nv.toLowerCase()})){spErr='Another space is already called "'+nv+'". Try another name.';render();return}
    spErr='';sg2.name=nv;saveSpaces();render()}
  else if(t.id==='patch-named'){named=t.checked;$('patch').innerHTML=patchRows()}
  else if(t.id==='path-dest'){traced=+t.value;render()}
  else if(t.id==='hops'){allHops=t.checked;render()}});
document.addEventListener('input',function(e){var t=e.target;
  if(t.dataset.devf){var fk=t.dataset.devf;if(fk.indexOf('p:')===0)devForm.places[fk.slice(2)]=t.value;else if(fk==='subnet'||fk==='ip'||fk==='place')devForm[fk]=t.value;return}
  if(t.id==='map-q'){mapQ=t.value;render()}
  else if(t.id==='src-search'){q=t.value;$('srcs').innerHTML=srcListHtml()}
  else if(t.id==='patch-search'){pq=t.value;$('patch').innerHTML=patchRows()}});
function clearOver(){document.querySelectorAll('.over').forEach(function(x){x.classList.remove('over')})}
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('[data-src]');if(c){e.dataTransfer.setData('text/plain',c.dataset.src);e.dataTransfer.effectAllowed='copy'}});
document.addEventListener('dragover',function(e){var t=e.target.closest('[data-dest]');if(t){e.preventDefault();clearOver();t.classList.add('over')}});
document.addEventListener('dragend',clearOver);
document.addEventListener('drop',function(e){var t=e.target.closest('[data-dest]');clearOver();if(!t)return;e.preventDefault();var raw=e.dataTransfer.getData('text/plain');if(!/^\d+$/.test(raw)||!RT.inL[+raw])return;routeDest(+t.dataset.dest,+raw)});
function connectES(){
  if(!LIVE)return;
  if(es)es.close();
  es=new EventSource('events');
  es.onmessage=function(e){lost=false;var snap=JSON.parse(e.data);if(mode==='live'){load(snap);latest=snap;render()}else{latest=snap;conn=snap.conn;meta(snap);renderShell()}};
  es.onerror=function(){lost=true;renderShell()}}
if(LIVE){connectES();window.fetch('auth').then(function(r){return r.json()}).then(function(j){auth.pinSet=!!j.pinSet;auth.ok=!!j.ok;auth.open=!!j.open;render()}).catch(function(){})}
function fromHash(){var h=(location.hash||'').replace('#','');if(h.indexOf('room-')===0){view='room';roomId=h.slice(5)}else if(['overview','map','floor','path','patch','devices','spaces'].indexOf(h)>=0)view=h==='path'?'map':h;render()}
window.addEventListener('hashchange',fromHash);
fromHash();
})();
</script>
